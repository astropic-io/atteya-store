@let g = guide();
@if (g.hasLengths) {
  <div class="elements-end">
    <mat-button-toggle-group
      class="pill-switch"
      aria-label="Measurement unit"
      hideSingleSelectionIndicator
      [value]="unit()"
      (change)="unit.set($event.value)"
    >
      <mat-button-toggle value="cm">Centimetres</mat-button-toggle>
      <mat-button-toggle value="in">Inches</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
}

<p class="font-body-md" [class.mt-4]="g.hasLengths">{{ intro() }}</p>

<!-- Mouse drag only while the table is wider than its box; the wheel stays on the page, and touch and trackpads scroll natively. -->
<section
  class="size-guide"
  tabindex="0"
  [attr.aria-label]="g.label + ' size chart'"
  appHorizontalScroll
  #scroller="horizontalScroll"
  [trackScroll]="true"
  [snapToItems]="false"
  [enableWheel]="false"
  [enableDrag]="scroller.canPrev() || scroller.canNext()"
>
  <table class="size-guide__table">
    <caption class="sr-only">
      {{
        g.label
      }}
      size chart.
      {{
        intro()
      }}
    </caption>
    <thead>
      <tr>
        <td></td>
        @for (size of g.sizes; track size) {
          <th scope="col">{{ size }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of g.rows; track row.label) {
        <tr>
          <th scope="row">{{ row.label }}</th>
          @for (size of g.sizes; track size) {
            <td>{{ row[unit()][size] ?? '–' }}</td>
          }
        </tr>
      }
    </tbody>
  </table>
</section>
