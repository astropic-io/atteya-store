@let row = view();
<button
  #trigger
  type="button"
  data-choice
  class="pdp-gift-item"
  [disabled]="disabled()"
  [attr.aria-describedby]="describedBy()"
  aria-haspopup="dialog"
  (click)="opened.emit(trigger)"
>
  @if (row.choice; as choice) {
    <span class="pdp-gift-thumb">
      @if (choice.imagePath) {
        <img
          [ngSrc]="path(choice.imagePath)"
          [appImageFallback]="choice.imagePath"
          alt=""
          width="56"
          height="56"
          class="size-full object-cover"
        />
      }
    </span>
  } @else if (row.peek.length > 0) {
    <span class="pdp-gift-peek" aria-hidden="true">
      @for (choice of row.peek; track choice.productId) {
        <span class="pdp-gift-thumb pdp-gift-thumb--peek">
          @if (choice.imagePath) {
            <img
              [ngSrc]="path(choice.imagePath)"
              [appImageFallback]="choice.imagePath"
              alt=""
              width="44"
              height="44"
              class="size-full object-cover"
            />
          }
        </span>
      }
      <span class="pdp-gift-thumb pdp-gift-thumb--peek pdp-gift-thumb--more">+{{ row.more }}</span>
    </span>
  } @else {
    <span class="pdp-gift-thumb pdp-gift-thumb--empty" aria-hidden="true">
      <mat-icon name="add" />
    </span>
  }
  <span class="pdp-gift-item__text">
    <span class="font-label-lg font-bold!">{{ title() }}</span>
    <span class="pdp-gift-item__detail" [class.text-on-surface-variant]="!row.done">{{ row.detail }}</span>
  </span>
  <span class="pdp-gift-item__action">
    {{ row.choice ? 'Change' : 'Choose' }}
    <mat-icon name="chevron_right" aria-hidden="true" />
  </span>
</button>
