<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Atteya Store</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://ik.imagekit.io" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atteya" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      try {
        var r = document.documentElement;
        if (r.hasAttribute('data-currency-ready')) {
        } else {
          var c = '';
          try {
            c = (new URLSearchParams(location.search).get('cur') || '').toUpperCase();
          } catch (e) {}
          var country = r.getAttribute('data-visitor-country') || '';
          if (c === 'EGP' || country === 'EG') {
          } else if (c || country) {
            r.setAttribute('data-cur-pending', '');
          } else {
            r.setAttribute('data-cur-pending', '');
          }
          // Country unknown on the server (ATS-313): it rendered the Egypt price, which is right
          // for a browser in Egypt, so show it now; elsewhere the app picks by time zone.
          if (!c && r.hasAttribute('data-cur-by-zone')) {
            var tz = '';
            try {
              tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
            } catch (e) {}
            if (tz === 'Africa/Cairo') r.removeAttribute('data-cur-pending');
          }
        }
        // The country the shopper told us (ATS-317, currency-detect.ts): the remembered checkout or
        // Account country, else a signed-in shopper's saved address. When its prices differ from
        // the ones rendered, hide them until the app shows the right ones.
        var cq = '';
        try {
          cq = new URLSearchParams(location.search).get('cur') || '';
        } catch (e) {}
        if (!cq) {
          var pref = '';
          try {
            var signedIn = localStorage.getItem('atteya-signed-in') === '1';
            var sc = signedIn ? JSON.parse(localStorage.getItem('atteya.savedCountry.v1') || 'null') : null;
            var uid = sc && typeof sc.uid === 'string' ? sc.uid : '';
            var rc = JSON.parse(localStorage.getItem('atteya.browseCountry.v1') || 'null');
            var age = rc ? Date.now() - rc.savedAt : -1;
            if (rc && typeof rc.country === 'string' && age >= 0 && age <= 2592000000) {
              if (!uid || !rc.uid || rc.uid === uid) pref = rc.country;
            }
            if (!pref && sc && typeof sc.country === 'string') pref = sc.country;
          } catch (e) {}
          var shown = r.hasAttribute('data-cur-by-zone') ? '' : r.getAttribute('data-visitor-country') || '';
          if (pref === 'EG' && (shown === 'EG' || r.hasAttribute('data-cur-by-zone'))) {
            r.removeAttribute('data-cur-pending');
          } else if (pref && pref !== shown) {
            r.setAttribute('data-cur-pending', '');
          }
        }
      } catch (e) {}
      // Signed in on this device (signed-in-hint.ts, ATS-287): footer.css hides the email sign-up.
      try {
        if (localStorage.getItem('atteya-signed-in') === '1') {
          document.documentElement.setAttribute('data-signed-in', '');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
